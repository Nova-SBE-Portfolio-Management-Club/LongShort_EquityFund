name: Tests and reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
            requirements-results.txt
      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-results.txt
      - name: Check maintained code and repository files
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python scripts/check_repository.py
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Run the synthetic example
        run: python src/playground/backtest_demo.py --output "$RUNNER_TEMP/backtest-demo.png"
      - name: Verify published research inputs and results
        if: matrix.python-version == '3.13'
        run: python scripts/reproduce_results.py --check
