[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "src/utils/backtest.py",
    "src/playground/backtest_demo.py",
    "src/playground/earnings_surprise/backtest.py",
    "src/playground/earnings_surprise/best_earnsurp.py",
    "scripts/*.py",
    "tests/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
# The earnings strategy uses manually aligned configuration fields.
exclude = ["src/playground/earnings_surprise/best_earnsurp.py"]
